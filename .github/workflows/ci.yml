name: CI / Production Build & Typecheck

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Verify Knowledge Extraction
        run: npm run extract:knowledge

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Dispatch Knowledge Update to nstok-knowledge-master
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        env:
          DISPATCH_PAT: ${{ secrets.KNOWLEDGE_DISPATCH_PAT }}
        run: |
          if [ -z "$DISPATCH_PAT" ]; then
            echo "⚠️ KNOWLEDGE_DISPATCH_PAT is not set in repository secrets."
            exit 0
          fi

          echo "🚀 Sending repository_dispatch to nstok-id/nstok-knowledge-master..."
          HTTP_CODE=$(curl -s -o resp.json -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_PAT" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "User-Agent: nstok-app-POS-CI" \
            https://api.github.com/repos/nstok-id/nstok-knowledge-master/dispatches \
            -d "{\"event_type\":\"sync-knowledge\",\"client_payload\":{\"repository\":\"nstok-app-POS\",\"branch\":\"${{ github.ref_name }}\",\"commit_hash\":\"${{ github.sha }}\",\"raw_url\":\"https://raw.githubusercontent.com/nstok-id/nstok-app-POS/${{ github.ref_name }}/knowledge-payload.json\"}}")

          echo "GitHub API Response Code: $HTTP_CODE"
          cat resp.json
          if [ "$HTTP_CODE" -eq 204 ]; then
            echo "🎉 repository_dispatch SUCCESS! Sinyal diterima oleh nstok-knowledge-master (HTTP 204)."
          else
            echo "⚠️ Dispatch response: $HTTP_CODE"
          fi
