name: 🔄 Auto-Sync Knowledge Master

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'docs/**'
      - 'PRD/**'
      - '*.md'
  workflow_dispatch: # Memungkinkan trigger manual dari web GitHub

jobs:
  sync-knowledge:
    name: 🌲 Extract AST & Dispatch to Knowledge Master
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🌲 Extract Code AST & Markdown Documents
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/extract-knowledge.mjs

      - name: 🚀 Dispatch Payload to VPS Knowledge Master
        env:
          SYNC_URL: ${{ secrets.KNOWLEDGE_SYNC_URL }}
          SYNC_SECRET: ${{ secrets.KNOWLEDGE_SYNC_SECRET }}
        run: |
          if [ -z "$SYNC_URL" ] || [ -z "$SYNC_SECRET" ]; then
            echo "⚠️ Secret KNOWLEDGE_SYNC_URL atau KNOWLEDGE_SYNC_SECRET belum diset di repository ini."
            echo "ℹ️ Harap tambahkan di Settings -> Secrets -> Actions:"
            echo "   KNOWLEDGE_SYNC_URL = https://mcp.nstok.my.id/api/sync-knowledge"
            echo "   KNOWLEDGE_SYNC_SECRET = (Token rahasia Anda)"
            exit 0
          fi

          echo "Mengirimkan knowledge-payload.json ke $SYNC_URL..."
          HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" -X POST "$SYNC_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $SYNC_SECRET" \
            -d @knowledge-payload.json)

          echo "Response HTTP Status: $HTTP_STATUS"
          cat response.txt

          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ]; then
            echo "❌ Gagal menyinkronkan knowledge base!"
            exit 1
          fi

          echo "🎉 Sinkronisasi ke VPS Knowledge Master Berhasil!"
